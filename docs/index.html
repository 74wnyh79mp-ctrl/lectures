<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Double lecture</title>
<meta name="theme-color" content="#f2f5f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111614" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Inter:wght@400;500;600&display=swap">
<style>
/* Une colonne de lecture, une édition finie, sans compteur de non-lus.
   Papier gris-vert froid, encre ardoise, accent sauge : calme, sans rouge d'alerte. */
:root {
  --paper: #f2f5f3; --card: #ffffff; --ink: #1c2422; --muted: #5b6a66;
  --rule: #d6dedb; --accent: #2e6b5f; --accent-soft: #e3eeea;
  --note: #f6f3e8; --note-ink: #5c5233;
  --font-display: "Newsreader", "Iowan Old Style", Georgia, serif;
  --font-text: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #111614; --card: #19201e; --ink: #e3ebe8; --muted: #98a8a3;
    --rule: #2a3431; --accent: #82c2b2; --accent-soft: #1f2f2b;
    --note: #23211a; --note-ink: #d8cda5; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--font-text); font-size: 16px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(48px + env(safe-area-inset-bottom, 0px));
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper);
}
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--paper); padding-block: 14px 10px;
  border-bottom: 1px solid var(--rule); display: flex; flex-direction: column; gap: 10px;
}
.bar-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-weight: 600; font-size: 1.35rem; letter-spacing: -0.01em; }
.brand span { color: var(--accent); }
.progress-label { font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.track { height: 3px; background: var(--rule); border-radius: 2px; overflow: hidden; }
.fill { height: 100%; width: 0; background: var(--accent); transition: width .3s ease; }
.tabs { display: flex; gap: 8px; }
.tab {
  font: inherit; font-size: 0.9rem; font-weight: 500; cursor: pointer;
  background: transparent; color: var(--muted); border: 1px solid var(--rule);
  border-radius: 999px; padding: 6px 14px;
}
.tab[aria-selected="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.tab .count { font-variant-numeric: tabular-nums; opacity: 0.7; margin-left: 4px; }

.intro { padding-top: 6px; display: flex; flex-direction: column; gap: 6px; }
.eyebrow { font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.intro h1 { font-family: var(--font-display); font-weight: 500; font-size: 2rem; line-height: 1.15; margin: 0; text-wrap: balance; }
.intro p { margin: 0; color: var(--muted); max-width: 60ch; }

.events { display: flex; flex-direction: column; gap: 16px; }
.event {
  background: var(--card); border: 1px solid var(--rule); border-radius: 10px;
  padding: 20px; display: flex; flex-direction: column; gap: 14px; transition: opacity .25s ease;
}
.event.read { opacity: 0.55; }
.event-head { display: flex; flex-direction: column; gap: 6px; }
.meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 0.78rem; color: var(--muted); }
.chip { background: var(--accent-soft); color: var(--accent); font-weight: 600; padding: 2px 8px; border-radius: 999px; }
.event h2 { font-family: var(--font-display); font-weight: 600; font-size: 1.4rem; line-height: 1.25; margin: 0; text-wrap: balance; }
.label { font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 0 0 4px; }
.block p { margin: 0; }
.context { background: var(--accent-soft); border-radius: 8px; padding: 12px 14px; font-size: 0.92rem; }
.unknown { background: var(--note); color: var(--note-ink); border-radius: 8px; padding: 12px 14px; font-size: 0.92rem; }
.unknown .label { color: inherit; opacity: 0.8; }

.lectures { border-top: 1px solid var(--rule); }
.lectures > .label { margin: 12px 0 4px; }
.lecture { display: flex; flex-direction: column; gap: 4px; padding-block: 12px; border-bottom: 1px solid var(--rule); min-width: 0; }
.lecture:last-child { border-bottom: 0; }
.outlet { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.outlet strong { font-weight: 600; }
.outlet small { color: var(--muted); font-size: 0.78rem; font-variant-numeric: tabular-nums; }
.headline { font-family: var(--font-display); font-size: 1.05rem; line-height: 1.35; margin: 0; overflow-wrap: anywhere; }
.angle { margin: 0; font-size: 0.92rem; color: var(--muted); }
.lecture a { color: var(--accent); font-size: 0.85rem; font-weight: 500; text-decoration: none; align-self: flex-start; }
.lecture a:hover, .lecture a:focus-visible { text-decoration: underline; }

.read-btn {
  align-self: flex-start; font: inherit; font-size: 0.88rem; font-weight: 500; cursor: pointer;
  background: transparent; color: var(--accent); border: 1px solid var(--accent);
  border-radius: 999px; padding: 6px 14px;
}
.read-btn[aria-pressed="true"] { background: var(--accent); color: var(--card); }
button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.empty, .state { background: var(--card); border: 1px dashed var(--rule); border-radius: 10px; padding: 20px; color: var(--muted); }
.end { padding: 28px 4px 8px; display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--rule); }
.end h2 { font-family: var(--font-display); font-weight: 500; font-size: 1.6rem; margin: 0; }
.end p { margin: 0; color: var(--muted); max-width: 60ch; }
details { font-size: 0.82rem; color: var(--muted); }
details ul { margin: 8px 0 0; padding-left: 18px; }
summary { cursor: pointer; }

@media (prefers-reduced-motion: reduce) { .fill, .event { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <div class="bar-row">
      <div class="brand">Double <span>lecture</span></div>
      <div class="progress-label" id="progress-label"></div>
    </div>
    <div class="track" aria-hidden="true"><div class="fill" id="fill"></div></div>
    <div class="tabs" role="tablist" id="tabs"></div>
  </header>

  <section class="intro">
    <div class="eyebrow" id="eyebrow">Chargement de l'édition…</div>
    <h1 id="headline">L'essentiel, vu sous plusieurs angles</h1>
    <p id="intro-text">Pour chaque événement : les faits, un repère pour situer, puis la manière dont différents journaux l'ont traité.</p>
  </section>

  <main class="events" id="events"></main>

  <section class="end" id="end" hidden>
    <h2>C'est tout pour cette édition.</h2>
    <p id="end-text">Vous êtes à jour.</p>
    <details id="sources-details">
      <summary>Sources consultées</summary>
      <ul id="sources-list"></ul>
    </details>
  </section>
</div>

<script>
let edition = null;
let current = null;
let readSet = new Set();

function storageKey() { return "double-lecture-lus-" + (edition ? edition.genere_le : ""); }
function loadRead() {
  try { readSet = new Set(JSON.parse(localStorage.getItem(storageKey()) || "[]")); }
  catch (e) { readSet = new Set(); }
}
function saveRead() {
  try { localStorage.setItem(storageKey(), JSON.stringify([...readSet])); } catch (e) {}
}

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}
function block(cls, label, text) {
  const b = el("div", "block " + cls);
  b.appendChild(el("p", "label", label));
  b.appendChild(el("p", null, text));
  return b;
}
function eventKey(catId, i) { return catId + ":" + i; }
function timeLabel(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return "";
  return d.toLocaleString("fr-FR", { weekday: "short", hour: "2-digit", minute: "2-digit", timeZone: "Europe/Paris" });
}

function updateProgress() {
  const all = [];
  edition.categories.forEach(c => c.events.forEach((_, i) => all.push(eventKey(c.id, i))));
  const n = all.filter(k => readSet.has(k)).length;
  document.getElementById("progress-label").textContent = all.length ? n + " sur " + all.length + " lus" : "";
  document.getElementById("fill").style.width = all.length ? (n / all.length * 100) + "%" : "0";
  saveRead();
}

function renderTabs() {
  const tabs = document.getElementById("tabs");
  tabs.textContent = "";
  edition.categories.forEach(c => {
    const b = el("button", "tab");
    b.type = "button";
    b.id = "tab-" + c.id;
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", c.id === current ? "true" : "false");
    b.appendChild(document.createTextNode(c.label));
    b.appendChild(el("span", "count", String(c.events.length)));
    b.addEventListener("click", () => { location.hash = c.id; });
    tabs.appendChild(b);
  });
}

function renderCategory() {
  const cat = edition.categories.find(c => c.id === current) || edition.categories[0];
  const root = document.getElementById("events");
  root.textContent = "";
  if (!cat.events.length) {
    root.appendChild(el("div", "empty", "Aucun événement dans cette catégorie pour cette édition. Les flux n'ont peut-être pas répondu : voir « Sources consultées » en bas de page."));
  }
  cat.events.forEach((ev, i) => {
    const key = eventKey(cat.id, i);
    const card = el("article", "event");

    const head = el("div", "event-head");
    const meta = el("div", "meta");
    meta.appendChild(el("span", "chip", ev.theme || cat.label));
    meta.appendChild(el("span", null, ev.lectures.length + (ev.lectures.length > 1 ? " sources" : " source")));
    head.appendChild(meta);
    head.appendChild(el("h2", null, ev.titre));
    card.appendChild(head);

    card.appendChild(block("essentiel", "L'essentiel", ev.essentiel));
    if (ev.pour_situer) card.appendChild(block("context", "Pour situer", ev.pour_situer));
    if (ev.incertain) card.appendChild(block("unknown", "Ce qui reste incertain", ev.incertain));

    const lec = el("div", "lectures");
    lec.appendChild(el("p", "label", "Double lecture · " + ev.lectures.length + (ev.lectures.length > 1 ? " regards" : " regard")));
    ev.lectures.forEach(l => {
      const row = el("div", "lecture");
      const o = el("div", "outlet");
      o.appendChild(el("strong", null, l.source));
      o.appendChild(el("small", null, timeLabel(l.publie)));
      row.appendChild(o);
      row.appendChild(el("p", "headline", "« " + l.titre_original + " »"));
      if (l.angle) row.appendChild(el("p", "angle", l.angle));
      if (/^https:\/\//.test(l.lien || "")) {
        const a = el("a", null, "Lire l'article ↗");
        a.href = l.lien; a.target = "_blank"; a.rel = "noopener";
        row.appendChild(a);
      }
      lec.appendChild(row);
    });
    card.appendChild(lec);

    const btn = el("button", "read-btn");
    btn.type = "button";
    const sync = () => {
      const on = readSet.has(key);
      btn.setAttribute("aria-pressed", on ? "true" : "false");
      btn.textContent = on ? "Lu ✓" : "Marquer comme lu";
      card.classList.toggle("read", on);
    };
    btn.addEventListener("click", () => {
      readSet.has(key) ? readSet.delete(key) : readSet.add(key);
      sync(); updateProgress();
    });
    sync();
    card.appendChild(btn);
    root.appendChild(card);
  });

  const list = document.getElementById("sources-list");
  list.textContent = "";
  (cat.sources || []).forEach(s => {
    const txt = s.source + " : " + s.articles + " article" + (s.articles > 1 ? "s" : "") + (s.erreur ? " (indisponible)" : "");
    list.appendChild(el("li", null, txt));
  });
  const other = edition.categories.find(c => c.id !== cat.id);
  document.getElementById("end-text").textContent = other
    ? "Vous êtes à jour pour la rubrique " + cat.label + ". Il reste la rubrique " + other.label + "."
    : "Vous êtes à jour.";
  document.getElementById("end").hidden = false;
}

function route() {
  const wanted = location.hash.replace("#", "");
  current = edition.categories.some(c => c.id === wanted) ? wanted : edition.categories[0].id;
  renderTabs();
  renderCategory();
  window.scrollTo(0, 0);
}

async function start() {
  try {
    const res = await fetch("edition.json", { cache: "no-store" });
    if (!res.ok) throw new Error("statut " + res.status);
    edition = await res.json();
  } catch (e) {
    document.getElementById("eyebrow").textContent = "Édition indisponible";
    document.getElementById("events").appendChild(el("div", "state", "Aucune édition n'a encore été publiée, ou elle n'a pas pu être chargée. Elle apparaîtra après le prochain passage automatique."));
    return;
  }
  const total = edition.categories.reduce((n, c) => n + c.events.length, 0);
  document.getElementById("eyebrow").textContent = "Édition du " + edition.moment + " · " + edition.date;
  document.getElementById("headline").textContent = total + " événements, plusieurs regards";
  document.getElementById("intro-text").textContent = "Environ " + Math.max(3, Math.round(total * 1.2)) + " minutes de lecture. Pour chaque événement : les faits, un repère pour situer, puis la manière dont différents journaux l'ont traité.";
  loadRead();
  updateProgress();
  route();
  window.addEventListener("hashchange", route);
}
start();
</script>
</body>
</html>
