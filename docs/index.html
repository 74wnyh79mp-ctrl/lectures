<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le Relevé</title>
<meta name="description" content="Les faits du jour, recoupés par plusieurs journaux.">
<meta name="theme-color" content="#efebe1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap">
<script>
  // Applique le thème choisi avant l'affichage, pour éviter un flash.
  try {
    var t = localStorage.getItem("releve-theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
</script>
<style>
/* Mise en page : une colonne de quotidien, manchette gothique, filets noirs.
   Papier journal le jour, papier sombre la nuit. Une seule couleur d'accent, lie-de-vin, très rare. */
:root {
  --paper: #efebe1;
  --ink: #1b1a17;
  --muted: #5d594f;
  --faint: #cdc6b6;
  --accent: #8a2b1d;
  --box: #e6e1d4;
  --font-mast: "UnifrakturMaguntia", "Old English Text MT", Georgia, serif;
  --font-head: "Old Standard TT", "Times New Roman", Georgia, serif;
  --font-body: "Libre Caslon Text", Georgia, "Times New Roman", serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #16150f; --ink: #e9e3d3; --muted: #a29c8b; --faint: #3b382f;
    --accent: #d98a6c; --box: #201e17; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #16150f; --ink: #e9e3d3; --muted: #a29c8b; --faint: #3b382f;
  --accent: #d98a6c; --box: #201e17; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--font-body); font-size: 17px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: env(safe-area-inset-top, 0px) calc(56px + env(safe-area-inset-bottom, 0px));
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper);
}
.page { max-width: 660px; margin: 0 auto; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
button:focus-visible, a:focus-visible, summary:focus-visible, select:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 3px;
}
.caps {
  font-family: var(--font-head); text-transform: uppercase;
  letter-spacing: 0.14em; font-size: 0.68rem;
}

/* Manchette */
.masthead { padding-top: 14px; text-align: center; }
.topline {
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
  color: var(--muted); padding-bottom: 6px;
}
.theme-btn { color: var(--muted); padding: 4px 0; }
.theme-btn:hover { color: var(--ink); }
.title {
  font-family: var(--font-mast); font-weight: 400; margin: 0;
  font-size: clamp(3rem, 15vw, 4.6rem); line-height: 1; letter-spacing: 0.01em;
}
.motto { font-family: var(--font-body); font-style: italic; color: var(--muted); font-size: 0.85rem; margin: 6px 0 10px; }
.folio {
  border-top: 3px double var(--ink); border-bottom: 1px solid var(--ink);
  display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; min-height: 44px;
}
.folio button { height: 44px; font-family: var(--font-head); font-size: 1.3rem; }
.folio button:disabled { opacity: 0.25; cursor: default; }
.folio-date { position: relative; display: flex; justify-content: center; align-items: center; min-width: 0; }
.folio-date span { font-family: var(--font-head); font-size: 0.95rem; }
.folio-date select {
  position: absolute; inset: 0; width: 100%; opacity: 0; cursor: pointer;
  font-size: 16px; /* évite le zoom automatique sur iPhone */
}

/* Rubriques */
.sections {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper);
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  border-bottom: 1px solid var(--ink); padding-block: 4px;
}
.tabs { display: flex; gap: 18px; }
.tab { padding: 10px 0 8px; color: var(--muted); border-bottom: 2px solid transparent; text-transform: uppercase; letter-spacing: 0.14em; font-family: var(--font-head); font-size: 0.78rem; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab .n { font-family: var(--font-body); letter-spacing: 0; text-transform: none; margin-left: 4px; }
.progress { color: var(--muted); font-variant-numeric: tabular-nums; }

/* Articles */
main { display: flex; flex-direction: column; }
.item { padding-block: 22px; border-bottom: 1px solid var(--faint); display: flex; flex-direction: column; gap: 12px; transition: opacity .25s ease; }
.item.read { opacity: 0.5; }
.kicker { color: var(--accent); }
.item h2 {
  font-family: var(--font-head); font-weight: 700; margin: 0;
  font-size: 1.55rem; line-height: 1.18; text-wrap: balance;
}
.lede { margin: 0; hyphens: auto; -webkit-hyphens: auto; text-align: justify; }
.item:first-child .lede::first-letter {
  font-family: var(--font-head); font-weight: 700; float: left;
  font-size: 3.4em; line-height: 0.82; padding: 6px 8px 0 0;
}
.repere { background: var(--box); border-left: 3px solid var(--ink); padding: 10px 12px; font-size: 0.92rem; }
.repere .caps { display: block; margin-bottom: 2px; color: var(--muted); }
.doute { margin: 0; font-size: 0.92rem; font-style: italic; color: var(--muted); }
.doute b { font-style: normal; font-family: var(--font-head); color: var(--ink); }

details { border-top: 1px dotted var(--faint); }
summary {
  list-style: none; cursor: pointer; padding: 10px 0; display: flex; justify-content: space-between;
  align-items: center; gap: 12px; font-family: var(--font-head); font-size: 0.95rem;
}
summary::-webkit-details-marker { display: none; }
summary::after { content: "▸"; transition: transform .2s ease; color: var(--muted); }
details[open] > summary::after { transform: rotate(90deg); }
.ctx p { margin: 0 0 8px; font-size: 0.95rem; }
.note { color: var(--muted); font-style: italic; font-size: 0.8rem !important; }
.journal { padding: 10px 0; border-top: 1px solid var(--faint); display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.journal:first-of-type { border-top: 0; padding-top: 0; }
.journal-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.journal-head .caps { color: var(--ink); font-size: 0.72rem; }
.journal-head small { color: var(--muted); font-size: 0.78rem; font-variant-numeric: tabular-nums; }
.headline { margin: 0; font-family: var(--font-head); font-size: 1.02rem; line-height: 1.35; overflow-wrap: anywhere; }
.angle { margin: 0; color: var(--muted); font-size: 0.9rem; }
.journal a { color: var(--accent); font-size: 0.85rem; text-decoration: underline; text-underline-offset: 3px; align-self: flex-start; }

.read-btn { align-self: flex-start; color: var(--muted); padding: 6px 0; }
.read-btn[aria-pressed="true"] { color: var(--ink); }

.state { padding: 28px 0; color: var(--muted); font-style: italic; text-align: center; }
.end { text-align: center; padding-top: 30px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.fleuron { font-size: 1.6rem; color: var(--muted); line-height: 1; }
.end p { margin: 0; color: var(--muted); font-style: italic; max-width: 46ch; }
.end details { width: 100%; text-align: left; font-size: 0.85rem; color: var(--muted); }
.end ul { margin: 0 0 8px; padding-left: 18px; }

@media (prefers-reduced-motion: reduce) { .item, summary::after { transition: none; } }
</style>
</head>
<body>
<div class="page">
  <header class="masthead">
    <div class="topline caps">
      <span id="numero">Paris</span>
      <button type="button" class="theme-btn caps" id="theme-btn" aria-label="Changer de mode">Mode nuit</button>
    </div>
    <h1 class="title">Le Relevé</h1>
    <p class="motto">Les faits du jour, recoupés par plusieurs journaux</p>
    <div class="folio">
      <button type="button" id="prev" aria-label="Édition précédente" disabled>‹</button>
      <div class="folio-date">
        <span id="folio-label">Chargement…</span>
        <select id="date-select" aria-label="Choisir une édition"></select>
      </div>
      <button type="button" id="next" aria-label="Édition suivante" disabled>›</button>
    </div>
  </header>

  <nav class="sections">
    <div class="tabs caps" role="tablist" id="tabs"></div>
    <span class="progress caps" id="progress"></span>
  </nav>

  <main id="events"><p class="state">Chargement de l'édition…</p></main>

  <section class="end" id="end" hidden>
    <div class="fleuron" aria-hidden="true">❦</div>
    <p id="end-text">Fin de l'édition.</p>
    <details>
      <summary>Sources consultées</summary>
      <ul id="sources-list"></ul>
    </details>
  </section>
</div>

<script>
// ---------- Thème jour / nuit ----------
const root = document.documentElement;
const themeBtn = document.getElementById("theme-btn");
function isDark() {
  const t = root.getAttribute("data-theme");
  if (t) return t === "dark";
  return window.matchMedia("(prefers-color-scheme: dark)").matches;
}
function syncThemeBtn() {
  themeBtn.textContent = isDark() ? "Mode jour" : "Mode nuit";
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", isDark() ? "#16150f" : "#efebe1");
}
themeBtn.addEventListener("click", () => {
  const next = isDark() ? "light" : "dark";
  root.setAttribute("data-theme", next);
  try { localStorage.setItem("releve-theme", next); } catch (e) {}
  syncThemeBtn();
});
window.matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", syncThemeBtn);
syncThemeBtn();

// ---------- Données ----------
let editions = [];      // index des éditions archivées, la plus récente en premier
let position = 0;       // position de l'édition affichée dans cet index
let edition = null;
let current = null;     // rubrique affichée
let readSet = new Set();

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}
function readKey() { return "releve-lus-" + (edition ? edition.genere_le : ""); }
function loadRead() {
  try { readSet = new Set(JSON.parse(localStorage.getItem(readKey()) || "[]")); }
  catch (e) { readSet = new Set(); }
}
function saveRead() { try { localStorage.setItem(readKey(), JSON.stringify([...readSet])); } catch (e) {} }
function timeLabel(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return "";
  return d.toLocaleString("fr-FR", { weekday: "short", hour: "2-digit", minute: "2-digit", timeZone: "Europe/Paris" });
}
function capitalize(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

// ---------- Navigation par date ----------
function renderFolio() {
  document.getElementById("folio-label").textContent =
    capitalize(edition.date) + " · édition du " + edition.moment;
  const n = editions.length ? editions.length - position : 1;
  document.getElementById("numero").textContent = "N° " + n + " · Paris";
  document.getElementById("prev").disabled = position >= editions.length - 1;
  document.getElementById("next").disabled = position <= 0;
  const select = document.getElementById("date-select");
  select.textContent = "";
  editions.forEach((e, i) => {
    const o = el("option", null, capitalize(e.date) + " · " + e.moment);
    o.value = String(i);
    if (i === position) o.selected = true;
    select.appendChild(o);
  });
  select.disabled = editions.length < 2;
}
async function openEdition(i) {
  const entry = editions[i];
  if (!entry) return;
  try {
    const res = await fetch(entry.fichier, { cache: "no-store" });
    if (!res.ok) throw new Error();
    edition = await res.json();
    position = i;
    loadRead();
    renderFolio();
    renderAll();
    window.scrollTo(0, 0);
  } catch (e) {
    document.getElementById("folio-label").textContent = "Édition introuvable";
  }
}
document.getElementById("prev").addEventListener("click", () => openEdition(position + 1));
document.getElementById("next").addEventListener("click", () => openEdition(position - 1));
document.getElementById("date-select").addEventListener("change", e => openEdition(Number(e.target.value)));

// ---------- Rubriques et articles ----------
function eventKey(catId, i) { return catId + ":" + i; }
function updateProgress() {
  const keys = [];
  edition.categories.forEach(c => c.events.forEach((_, i) => keys.push(eventKey(c.id, i))));
  const n = keys.filter(k => readSet.has(k)).length;
  document.getElementById("progress").textContent = keys.length ? n + " / " + keys.length + " lus" : "";
  saveRead();
}
function renderTabs() {
  const tabs = document.getElementById("tabs");
  tabs.textContent = "";
  edition.categories.forEach(c => {
    const b = el("button", "tab");
    b.type = "button";
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", c.id === current ? "true" : "false");
    b.appendChild(document.createTextNode(c.label));
    b.appendChild(el("span", "n", "(" + c.events.length + ")"));
    b.addEventListener("click", () => { location.hash = c.id; });
    tabs.appendChild(b);
  });
}
function detailsBlock(cls, summaryText) {
  const d = el("details", cls);
  d.appendChild(el("summary", null, summaryText));
  return d;
}
function renderCategory() {
  const cat = edition.categories.find(c => c.id === current) || edition.categories[0];
  const root = document.getElementById("events");
  root.textContent = "";
  if (!cat.events.length) {
    root.appendChild(el("p", "state", "Rien d'important à relever dans cette rubrique pour cette édition."));
  }
  cat.events.forEach((ev, i) => {
    const key = eventKey(cat.id, i);
    const item = el("article", "item");
    item.appendChild(el("div", "kicker caps", ev.theme || cat.label));
    item.appendChild(el("h2", null, ev.titre));
    item.appendChild(el("p", "lede", ev.essentiel));

    if (ev.pour_situer) {
      const r = el("aside", "repere");
      r.appendChild(el("span", "caps", "Repère"));
      r.appendChild(document.createTextNode(ev.pour_situer));
      item.appendChild(r);
    }
    if (ev.incertain) {
      const d = el("p", "doute");
      d.appendChild(el("b", null, "À confirmer. "));
      d.appendChild(document.createTextNode(ev.incertain));
      item.appendChild(d);
    }
    if (ev.contexte) {
      const ctx = detailsBlock("ctx", "Pour comprendre");
      ctx.appendChild(el("p", null, ev.contexte));
      ctx.appendChild(el("p", "note", "Contexte général rédigé par l'IA, sans vérification : à recouper."));
      item.appendChild(ctx);
    }

    const n = ev.lectures.length;
    const jr = detailsBlock("journaux", n > 1 ? "Ce qu'en disent " + n + " journaux" : "Ce qu'en dit 1 journal");
    ev.lectures.forEach(l => {
      const row = el("div", "journal");
      const head = el("div", "journal-head");
      head.appendChild(el("span", "caps", l.source));
      head.appendChild(el("small", null, timeLabel(l.publie)));
      row.appendChild(head);
      row.appendChild(el("p", "headline", "« " + l.titre_original + " »"));
      if (l.angle) row.appendChild(el("p", "angle", l.angle));
      if (/^https:\/\//.test(l.lien || "")) {
        const a = el("a", null, "Lire l'article");
        a.href = l.lien; a.target = "_blank"; a.rel = "noopener";
        row.appendChild(a);
      }
      jr.appendChild(row);
    });
    item.appendChild(jr);

    const btn = el("button", "read-btn caps");
    btn.type = "button";
    const sync = () => {
      const on = readSet.has(key);
      btn.setAttribute("aria-pressed", on ? "true" : "false");
      btn.textContent = on ? "✓ Lu" : "Marquer comme lu";
      item.classList.toggle("read", on);
    };
    btn.addEventListener("click", () => {
      readSet.has(key) ? readSet.delete(key) : readSet.add(key);
      sync(); updateProgress();
    });
    sync();
    item.appendChild(btn);
    root.appendChild(item);
  });

  const list = document.getElementById("sources-list");
  list.textContent = "";
  (cat.sources || []).forEach(s => {
    list.appendChild(el("li", null, s.source + " : " + s.articles + " article" + (s.articles > 1 ? "s" : "") + (s.erreur ? " (indisponible)" : "")));
  });
  const other = edition.categories.find(c => c.id !== cat.id);
  document.getElementById("end-text").textContent = other
    ? "Fin de la rubrique " + cat.label + ". Il reste la rubrique " + other.label + "."
    : "Fin de l'édition.";
  document.getElementById("end").hidden = false;
}
function renderAll() {
  const wanted = location.hash.replace("#", "");
  current = edition.categories.some(c => c.id === wanted) ? wanted : edition.categories[0].id;
  renderTabs();
  renderCategory();
  updateProgress();
}
window.addEventListener("hashchange", () => { if (edition) { renderAll(); window.scrollTo(0, 0); } });

// ---------- Démarrage ----------
async function start() {
  try {
    const res = await fetch("edition.json", { cache: "no-store" });
    if (!res.ok) throw new Error();
    edition = await res.json();
  } catch (e) {
    document.getElementById("folio-label").textContent = "Aucune édition";
    document.getElementById("events").textContent = "";
    document.getElementById("events").appendChild(el("p", "state", "Aucune édition n'a encore été publiée. Elle apparaîtra après le prochain passage automatique."));
    return;
  }
  try {
    const res = await fetch("archive/index.json", { cache: "no-store" });
    if (res.ok) editions = await res.json();
  } catch (e) { editions = []; }
  position = Math.max(0, editions.findIndex(e => e.genere_le === edition.genere_le));
  if (!editions.length) editions = [{ fichier: "edition.json", date: edition.date, moment: edition.moment, genere_le: edition.genere_le }];
  loadRead();
  renderFolio();
  renderAll();
}
start();
</script>
</body>
</html>
